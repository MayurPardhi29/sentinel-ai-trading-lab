   name: CI

   on:
     push:
       branches: [main]
     pull_request:

   jobs:
     backend:
       runs-on: ubuntu-latest
       strategy:
         matrix:
           service: [market-data-service, strategy-engine]
       defaults:
         run:
           working-directory: backend/${{ matrix.service }}
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-java@v4
           with:
             distribution: temurin
             java-version: 21
             cache: maven
         - run: chmod +x mvnw && ./mvnw -B test

     frontend:
       runs-on: ubuntu-latest
       defaults:
         run:
           working-directory: frontend/sentinel-ui
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-node@v4
           with:
             node-version: 20
             cache: npm
             cache-dependency-path: frontend/sentinel-ui/package-lock.json
         - run: npm ci
         - run: npm run build