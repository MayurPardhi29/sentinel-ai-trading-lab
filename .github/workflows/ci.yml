name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        service: [market-data-service, strategy-engine]
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B test

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend/sentinel-ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/sentinel-ui/package-lock.json
      - run: npm ci
      - run: npm run build