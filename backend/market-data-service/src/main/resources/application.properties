spring.application.name=market-data-service

twelvedata.api.key=${TWELVEDATA_API_KEY:demo}
twelvedata.base.url=https://api.twelvedata.com

twelvedata.default-outputsize=${TWELVEDATA_DEFAULT_OUTPUTSIZE:300}
twelvedata.max-outputsize=${TWELVEDATA_MAX_OUTPUTSIZE:500}

market-data.cache-ttl-seconds=${MARKET_DATA_CACHE_TTL_SECONDS:60}

management.endpoints.web.exposure.include=health,info
